name: Risk tier

# The gate. workflow_run always runs THIS file, and checks out the scripts and lists, as
# they are on the DEFAULT branch (production), never a PR's copies, so a PR can't rewrite
# the gate that judges it. The PR's commits are checked out only as data (git diff/show);
# no PR code runs here. Keep it that way: never run, source, install or build from pr/.
#
# The verdict is a `risk-tier` commit status on the PR's head commit, posted with this
# run's GITHUB_TOKEN. The ruleset matches it by name only, so a PR that adds its own job
# or status called risk-tier could fake a pass. That PR touches .github/, so Mika sees it
# in the diff. Posting as a GitHub App would close this; see the runbook's "Later" section.
on:
  workflow_run:
    workflows: [Risk tier trigger]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

# Runs for the same branch queue instead of cancelling each other, so a run is never
# killed between "pending" and its verdict. Each run reads fresh state, so queueing costs
# nothing. Runs that aren't for a pull_request (a PR-added workflow can borrow the
# trigger's name) get a group of their own, so they can't push a real run out.
concurrency:
  group: >-
    risk-tier-${{ github.event.workflow_run.event == 'pull_request'
    && format('{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch)
    || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# `shell: bash` runs with -eo pipefail, so a failed `gh api` in a pipe fails the step
# instead of handing jq a partial list (missing pages could hide a removed label).
defaults:
  run:
    shell: bash

jobs:
  gate:
    # Not named risk-tier: this job's own check run lands on production's commit, not
    # the PR's. The required check is the commit status this job posts.
    name: Risk tier gate
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HUMAN_REVIEWERS: ${{ vars.HUMAN_REVIEWERS }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # The commit the trigger ran on. Every status this run posts goes here.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Pending first, so a run that dies halfway can't leave an older success standing
      # on this commit (say, after Mika removed her label to withdraw a review).
      - name: Mark pending
        run: |
          gh api -X POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state=pending -f context=risk-tier -f description="Checking risk tier" \
            -f target_url="$RUN_URL" > /dev/null

      # The gate's own scripts, filter and lists, from the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      # Judge exactly the commit the trigger ran on (HEAD_SHA). The PRs come from the
      # run's payload plus a lookup by commit (the payload can be empty), each re-read
      # from the API. A commit status belongs to the commit, not the PR, so if this head
      # is in more than one gated PR, one verdict can't fit both: fail. If it's in none
      # (a fork, a closed PR, a branch that moved on), there's nothing to approve: fail.
      # Failing is always safe; a newer run judges a newer head.
      - name: Find the pull request
        id: pr
        env:
          PULLS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          {
            jq -r '.[].number' <<< "$PULLS"
            gh api "repos/$GH_REPO/commits/$HEAD_SHA/pulls" --jq '.[].number'
          } | sort -un > "$RUNNER_TEMP/numbers.txt"
          while read -r NUMBER; do
            gh api "repos/$GH_REPO/pulls/$NUMBER"
          done < "$RUNNER_TEMP/numbers.txt" | jq -s . > "$RUNNER_TEMP/candidates.json"
          jq --arg repo "$GH_REPO" --arg sha "$HEAD_SHA" \
            -f "$GITHUB_WORKSPACE/base/.github/scripts/gated_prs.jq" "$RUNNER_TEMP/candidates.json" > "$RUNNER_TEMP/gated.json"
          COUNT=$(jq length "$RUNNER_TEMP/gated.json")
          if [ "$COUNT" -ne 1 ]; then
            if [ "$COUNT" -eq 0 ]; then
              DESC="No open PR into a gated branch has this commit as its head"
            else
              DESC="This commit heads $COUNT gated PRs; one verdict can't cover them all"
            fi
            echo "::warning::$DESC. Posting failure."
            gh api -X POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
              -f state=failure -f context=risk-tier -f description="$DESC" \
              -f target_url="$RUN_URL" > /dev/null
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq '.[0]' "$RUNNER_TEMP/gated.json" > "$RUNNER_TEMP/pr.json"
          {
            echo "found=true"
            echo "number=$(jq -r .number "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"

      # The PR's commits, as data only. Full history so the base commit is present too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outputs.found == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # The default branch's risk_tier.py, run inside pr/ so git sees the PR's commits.
      # The lists are passed as absolute paths into base/, so they always come from the
      # default branch; if it has no lists, reading them fails and the PR is high.
      # -I: isolated mode, so nothing in pr/ or the environment changes what Python loads.
      - name: Classify
        if: steps.pr.outputs.found == 'true'
        working-directory: pr
        run: |
          BASE_SHA=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")
          python3 -I "$GITHUB_WORKSPACE/base/.github/scripts/risk_tier.py" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --patterns "$GITHUB_WORKSPACE/base/.github/risk-tiers.txt" \
            --low-patterns "$GITHUB_WORKSPACE/base/.github/low-risk.txt" > "$RUNNER_TEMP/tier.json"
          cat "$RUNNER_TEMP/tier.json"

      # Who added the label and when, and when the base last changed (issue events), and
      # when the head commit landed on the branch (repository activity). Both are GitHub's own records; a PR can't write
      # them.
      - name: Check for a human review
        if: steps.pr.outputs.found == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          echo '{"approved": false, "remove_label": false, "reason": "not checked"}' > "$RUNNER_TEMP/review.json"
          if [ "$(jq -r .tier "$RUNNER_TEMP/tier.json")" != "high" ]; then exit 0; fi
          HEAD_REF=$(jq -r .head.ref "$RUNNER_TEMP/pr.json")
          gh api --paginate "repos/$GH_REPO/issues/$PR/events?per_page=100" --jq '.[]' \
            | jq -s . > "$RUNNER_TEMP/events.json" || echo '"fetch failed"' > "$RUNNER_TEMP/events.json"
          # Newest first; human_review.py only trusts the newest record.
          gh api -X GET "repos/$GH_REPO/activity" -f ref="refs/heads/$HEAD_REF" -f direction=desc -F per_page=100 \
            > "$RUNNER_TEMP/activity.json" || echo '"fetch failed"' > "$RUNNER_TEMP/activity.json"
          python3 -I "$GITHUB_WORKSPACE/base/.github/scripts/human_review.py" \
            --events "$RUNNER_TEMP/events.json" --activity "$RUNNER_TEMP/activity.json" \
            --head-sha "$HEAD_SHA" --reviewers "$HUMAN_REVIEWERS" > "$RUNNER_TEMP/review.json"
          cat "$RUNNER_TEMP/review.json"

      # Labels are only the UI. Changes made with GITHUB_TOKEN don't trigger workflows,
      # so none of this can loop.
      - name: Labels and summary
        if: steps.pr.outputs.found == 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          TIER_JSON="$RUNNER_TEMP/tier.json"
          REVIEW_JSON="$RUNNER_TEMP/review.json"
          TIER=$(jq -r .tier "$TIER_JSON")
          {
            echo "## Risk tier: $TIER (PR #$PR)"
            echo
            jq -r .reason "$TIER_JSON"
            echo
            # Filenames come from the PR: escape them so one can't hide the others.
            jq -r '.files[] | "- <code>\(@html | gsub("`"; "&#96;"))</code>"' "$TIER_JSON"
            jq -r '.packages[] | "- new package: <code>\(@html | gsub("`"; "&#96;"))</code>"' "$TIER_JSON"
            if [ "$TIER" = "high" ]; then
              echo
              echo "**Human review:** $(jq -r .reason "$REVIEW_JSON")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          LABELS=$(gh api "repos/$GH_REPO/issues/$PR/labels" --jq '.[].name')
          if [ "$TIER" = "high" ]; then
            gh api -X POST "repos/$GH_REPO/issues/$PR/labels" -f 'labels[]=risk: high' > /dev/null \
              || echo "::warning::Couldn't add the risk: high label."
          elif printf '%s\n' "$LABELS" | grep -qx 'risk: high'; then
            gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/risk%3A%20high" > /dev/null \
              || echo "::warning::Couldn't remove the risk: high label."
          fi
          # A label that's on but doesn't count (stale, or not from a listed reviewer)
          # comes off, so Mika can simply add it again.
          if [ "$(jq -r .remove_label "$REVIEW_JSON")" = "true" ]; then
            echo "::warning::Removing a human-reviewed label that doesn't count: $(jq -r .reason "$REVIEW_JSON")"
            gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/human-reviewed" > /dev/null \
              || echo "::warning::Couldn't remove the human-reviewed label; remove it by hand."
          fi

      - name: Post the verdict
        if: steps.pr.outputs.found == 'true'
        run: |
          TIER=$(jq -r .tier "$RUNNER_TEMP/tier.json")
          if [ "$TIER" = "low" ]; then
            STATE=success; DESC="Low risk"
          elif [ "$(jq -r .approved "$RUNNER_TEMP/review.json")" = "true" ]; then
            STATE=success; DESC="High risk, human-reviewed"
          else
            STATE=failure; DESC="High risk: needs human-reviewed. $(jq -r .reason "$RUNNER_TEMP/review.json")"
          fi
          gh api -X POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context=risk-tier -f description="${DESC:0:139}" \
            -f target_url="$RUN_URL" > /dev/null
          echo "risk-tier: $STATE ($DESC)"

      # Anything above broke: say so on the commit. If even this fails, the pending
      # status stays, which blocks the merge too.
      - name: Post an error
        if: failure()
        run: |
          gh api -X POST "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state=error -f context=risk-tier -f description="The risk tier gate failed; see the run" \
            -f target_url="$RUN_URL" > /dev/null
