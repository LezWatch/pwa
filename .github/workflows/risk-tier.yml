name: Risk tier

# pull_request_target, not pull_request: GitHub runs THIS file and the scripts as they
# are on the base branch, never the PR's copies, so a PR can't rewrite the gate that
# judges it. The PR's commits are checked out only as data (git diff/show); no PR code
# runs here. Keep it that way: never run, source, install or build anything from pr/.
on:
  pull_request_target:
    branches: [production, 'release/**']
    # `edited` covers a changed base branch: retargeting a PR re-runs the diff against
    # the new base, so a stale green check can't carry over (e.g. into production).
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Every run reads the same GitHub records and reaches the same answer, so cancelling an
# older run never loses an approval.
concurrency:
  group: risk-tier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  risk-tier:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HUMAN_REVIEWERS: ${{ vars.HUMAN_REVIEWERS }}
    steps:
      # The gate's own scripts and lists, from the base branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      # The PR's commits, as data only. Full history so the base commit is present too.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      # The label is only the way Mika says "I've read this". The gate never trusts the
      # label itself: it reads who added it, and when, from the issue events (see
      # human_review.py). These two steps just keep the label honest in the UI. Label
      # changes made with GITHUB_TOKEN don't trigger workflow runs, so this can't loop.
      - name: Remove a label added by someone not listed
        if: github.event.action == 'labeled' && github.event.label.name == 'human-reviewed'
        env:
          REVIEWER: ${{ github.event.sender.login }}
          SENDER_TYPE: ${{ github.event.sender.type }}
        run: |
          if [ "$SENDER_TYPE" != "User" ] || ! printf '%s\n' "$HUMAN_REVIEWERS" | tr ',' '\n' | tr -d ' ' | grep -qixF "$REVIEWER"; then
            echo "::warning::@$REVIEWER isn't in HUMAN_REVIEWERS; removing the human-reviewed label. It doesn't count."
            gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/human-reviewed" \
              || echo "::warning::Couldn't remove the human-reviewed label."
          fi

      - name: Remove a stale label on new commits
        if: github.event.action == 'synchronize'
        run: |
          if gh api "repos/$GH_REPO/issues/$PR/labels" --jq '.[].name' | grep -qx 'human-reviewed'; then
            gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/human-reviewed" \
              || echo "::warning::Couldn't remove the stale human-reviewed label; remove it by hand."
          fi

      # The base branch's risk_tier.py, run inside pr/ so git sees the PR's commits. The
      # lists are passed as absolute paths into base/, so they always come from the base
      # branch; if base has no lists, reading them fails and the PR is high (fail closed).
      # -I: isolated mode, so nothing in pr/ or the environment can change what Python loads.
      - name: Classify
        working-directory: pr
        run: |
          python3 -I "$GITHUB_WORKSPACE/base/.github/scripts/risk_tier.py" \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --patterns "$GITHUB_WORKSPACE/base/.github/risk-tiers.txt" \
            --low-patterns "$GITHUB_WORKSPACE/base/.github/low-risk.txt" > "$RUNNER_TEMP/tier.json"
          cat "$RUNNER_TEMP/tier.json"

      # Who added the label and when (issue events), and when the head commit landed on
      # the branch (repository activity). Both are GitHub's own records; a PR can't write
      # them. A PR from a fork has no activity here, so it can't be approved by label.
      - name: Check for a human review
        run: |
          echo '{"approved": false, "reason": "not checked"}' > "$RUNNER_TEMP/review.json"
          if [ "$(jq -r .tier "$RUNNER_TEMP/tier.json")" != "high" ]; then exit 0; fi
          if [ "$HEAD_REPO" != "$GH_REPO" ]; then
            echo '{"approved": false, "reason": "PRs from forks cannot be approved by label; push the branch to this repo."}' > "$RUNNER_TEMP/review.json"
            exit 0
          fi
          gh api --paginate "repos/$GH_REPO/issues/$PR/events?per_page=100" --jq '.[]' \
            | jq -s . > "$RUNNER_TEMP/events.json" || echo '"fetch failed"' > "$RUNNER_TEMP/events.json"
          gh api -X GET "repos/$GH_REPO/activity" -f ref="refs/heads/$HEAD_REF" -F per_page=100 \
            > "$RUNNER_TEMP/activity.json" || echo '"fetch failed"' > "$RUNNER_TEMP/activity.json"
          python3 -I "$GITHUB_WORKSPACE/base/.github/scripts/human_review.py" \
            --events "$RUNNER_TEMP/events.json" --activity "$RUNNER_TEMP/activity.json" \
            --head-sha "$HEAD_SHA" --reviewers "$HUMAN_REVIEWERS" > "$RUNNER_TEMP/review.json"
          cat "$RUNNER_TEMP/review.json"

      - name: Label and gate
        run: |
          TIER_JSON="$RUNNER_TEMP/tier.json"
          REVIEW_JSON="$RUNNER_TEMP/review.json"
          TIER=$(jq -r .tier "$TIER_JSON")
          {
            echo "## Risk tier: $TIER"
            echo
            jq -r .reason "$TIER_JSON"
            echo
            jq -r '.files[] | "- `\(.)`"' "$TIER_JSON"
            jq -r '.packages[] | "- new package: `\(.)`"' "$TIER_JSON"
            if [ "$TIER" = "high" ]; then
              echo
              echo "**Human review:** $(jq -r .reason "$REVIEW_JSON")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          LABELS=$(gh api "repos/$GH_REPO/issues/$PR/labels" --jq '.[].name')

          if [ "$TIER" = "low" ]; then
            if printf '%s\n' "$LABELS" | grep -qx 'risk: high'; then
              gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/risk%3A%20high" \
                || echo "::warning::Couldn't remove the risk: high label."
            fi
            exit 0
          fi

          gh api -X POST "repos/$GH_REPO/issues/$PR/labels" -f 'labels[]=risk: high' > /dev/null \
            || echo "::warning::Couldn't add the risk: high label."
          if [ "$(jq -r .approved "$REVIEW_JSON")" = "true" ]; then
            echo "High risk; $(jq -r .reason "$REVIEW_JSON")"
            exit 0
          fi
          TRIGGERS=$(jq -r '(.files + .packages) | .[:20] | join(", ")' "$TIER_JSON")
          echo "::error::High-risk changes need your review: $TRIGGERS. Read them, then add the human-reviewed label. ($(jq -r .reason "$REVIEW_JSON"))"
          exit 1
